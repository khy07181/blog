name: Deploy Quartz site to GitHub Pages
 
on:
  push:
    branches:
      - v4
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: |
          npx quartz build
          # ensure robots.txt is at the public root for GitHub Pages
          cp -f public/static/robots.txt public/robots.txt || true
      - name: Format sitemap.xml
        run: |
          # Format sitemap.xml for better compatibility with Google Search Console
          if [ -f public/sitemap.xml ]; then
            # Install xmllint if not available
            sudo apt-get update && sudo apt-get install -y libxml2-utils
            # Format and prettify the sitemap
            xmllint --format public/sitemap.xml > public/sitemap.formatted.xml
            mv public/sitemap.formatted.xml public/sitemap.xml
            echo "Sitemap formatted successfully"
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
 
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
