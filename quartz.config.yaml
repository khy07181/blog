# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
# Ported from v4 quartz.config.ts + quartz.layout.ts
configuration:
  pageTitle: "🪴 hayoung"
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: google
    tagId: G-5LV1MFRSYJ
  locale: en-US
  baseUrl: khy07181.github.io
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  # local transformer: inject custom <head> meta (google-site-verification, from v4 Head.tsx)
  - source: ./plugins/head-meta
    enabled: true
    order: 1
  # --- transformers (match v4 chain) ---
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: published
      priority:
        - frontmatter
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      display: desktop-only
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  # --- filters / core emitters ---
  - source: github:quartz-community/fonts
    enabled: true
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
      includeEmptyFiles: false
  - source: github:quartz-community/favicon
    enabled: true
  # v4 generateSocialImages: false -> keep og-image disabled
  - source: github:quartz-community/og-image
    enabled: false
  # v4 used default github.io domain (no custom domain) -> no CNAME file
  - source: github:quartz-community/cname
    enabled: false
  # --- page types ---
  - source: github:quartz-community/canvas-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  # --- layout components (match v4 quartz.layout.ts) ---
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  # local custom plugin: v4 SocialIcons (RSS / Email / GitHub sidebar icons)
  - source: ./plugins/social-icons
    enabled: true
    layout:
      position: left
      priority: 15
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: ./plugins/explorer
    enabled: true
    options:
      enableTagView: true
    layout:
      position: left
      priority: 40
  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  # local fork of content-meta: dates as YYYY-MM-DD (v4 Date.tsx behavior)
  - source: ./plugins/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  # v4 RecnetNotesForIndex: recent posts only on the index page
  # local fork of recent-notes: dates as YYYY-MM-DD (v4 Date.tsx behavior)
  - source: ./plugins/recent-notes
    enabled: true
    options:
      title: Recent Posts
      limit: 10
      showTags: true
      linkToMore: false
    layout:
      position: beforeBody
      priority: 40
      condition: index
  # v4 giscus comments
  - source: github:quartz-community/comments
    enabled: true
    options:
      provider: giscus
      options:
        repo: khy07181/khy07181.github.io
        repoId: R_kgDON9-dEA
        category: Announcements
        categoryId: DIC_kwDON9-dEM4CnOik
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        hayoung: https://github.com/khy07181
  # note-properties bundles the frontmatter parser (v4 Plugin.FrontMatter) -> REQUIRED.
  # hidePropertiesView keeps parsing but hides the properties table (match v4 look).
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      hidePropertiesView: true
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  # new v5 feature not present in v4 -> off to match current look
  - source: github:quartz-community/reader-mode
    enabled: false
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      positions:
        right: []
    tag:
      positions:
        right: []
    canvas: {}
    bases: {}
